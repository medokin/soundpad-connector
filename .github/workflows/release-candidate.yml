name: Release candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Verify 1.5.0 candidate without publishing
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOUNDPAD_INTEGRATION_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify candidate
        shell: pwsh
        run: ./verify-release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundpadconnector-1.5.0-candidate
          path: |
            artifacts/SoundpadConnector.1.5.0.nupkg
            artifacts/SoundpadConnector.1.5.0.nupkg.sha256
            RELEASE.md
          if-no-files-found: error
